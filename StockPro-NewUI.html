<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro · Modern Inventory Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0C12;
            font-family: 'Inter', sans-serif;
            color: #E8EDF5;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1A1F2E; }
        ::-webkit-scrollbar-thumb { background: #E94560; border-radius: 10px; }
        
        .app { display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar - Fixed spacing, larger text */
        .sidebar {
            width: 280px;
            background: #0D111A;
            border-right: 1px solid #1E2438;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar-header { padding: 28px 20px; border-bottom: 1px solid #1E2438; margin-bottom: 20px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon {
            width: 45px; height: 45px;
            background: linear-gradient(135deg, #E94560, #A5223F);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold;
            box-shadow: 0 8px 20px rgba(233,69,96,0.3);
        }
        .logo-text { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
        .logo-sub { font-size: 9px; color: #7A85A8; font-family: monospace; margin-top: 2px; }
        
        .nav-section {
            margin: 20px 0 8px 16px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #6B789B;
            text-transform: uppercase;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            margin: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #A8B3D6;
            font-size: 14px;
            font-weight: 500;
        }
        .nav-item i { width: 22px; font-size: 16px; }
        .nav-item:hover { background: rgba(233, 69, 96, 0.08); color: #FFFFFF; }
        .nav-item.active {
            background: linear-gradient(95deg, rgba(233,69,96,0.15), rgba(233,69,96,0.05));
            color: #E94560;
            border-left: 3px solid #E94560;
        }
        
        /* Main Content */
        .main-content { flex: 1; overflow-y: auto; padding: 28px 36px; }
        
        /* Cards & Components */
        .stat-card {
            background: #0F131E;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #1E2438;
            transition: all 0.2s;
        }
        .stat-card:hover { border-color: #E94560; transform: translateY(-2px); }
        
        .glass-card {
            background: rgba(18, 22, 32, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(233, 69, 96, 0.2);
            border-radius: 24px;
            transition: all 0.2s;
        }
        .glass-card:hover { border-color: rgba(233, 69, 96, 0.5); }
        
        .btn-primary {
            background: linear-gradient(105deg, #E94560, #C42B48);
            border: none;
            border-radius: 40px;
            padding: 10px 24px;
            font-weight: 600;
            font-size: 13px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(233, 69, 96, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(233, 69, 96, 0.35); }
        
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(233, 69, 96, 0.5);
            border-radius: 40px;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 500;
            color: #EFF3F8;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-outline:hover { background: rgba(233, 69, 96, 0.1); border-color: #E94560; }
        
        .badge {
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .badge-success { background: rgba(0, 230, 118, 0.12); color: #00e676; border: 1px solid rgba(0,230,118,0.2); }
        .badge-warning { background: rgba(255, 171, 0, 0.12); color: #FFAB00; border: 1px solid rgba(255,171,0,0.2); }
        .badge-danger { background: rgba(233, 69, 96, 0.12); color: #E94560; border: 1px solid rgba(233,69,96,0.2); }
        .badge-info { background: rgba(0, 212, 255, 0.12); color: #00D4FF; border: 1px solid rgba(0,212,255,0.2); }
        
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { text-align: left; padding: 14px 12px; font-size: 12px; font-weight: 600; color: #8192B0; border-bottom: 1px solid #202635; }
        .data-table td { padding: 14px 12px; font-size: 13px; border-bottom: 1px solid #171D2C; color: #CBD5F0; }
        .data-table tr:hover td { background: #0E131F; }
        
        .quick-action {
            background: #0F131E;
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #242B3F;
            cursor: pointer;
            transition: 0.2s;
        }
        .quick-action:hover { background: #171E30; border-color: #E94560; transform: translateX(5px); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate { animation: fadeIn 0.4s ease-out forwards; }
        
        input, select, textarea {
            background: #0F131F;
            border: 1px solid #2A314A;
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-size: 13px;
            outline: none;
            width: 100%;
        }
        input:focus, select:focus { border-color: #E94560; box-shadow: 0 0 0 2px rgba(233,69,96,0.1); }
    </style>
</head>
<body>
<div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">⬡</div>
                <div>
                    <div class="logo-text">StockPro</div>
                    <div class="logo-sub">IMS · v2.0</div>
                </div>
            </div>
        </div>
        
        <div style="flex: 1;">
            <div class="nav-section"><i class="fas fa-shield-alt"></i> AUTHENTICATION</div>
            <div class="nav-item" data-page="users"><i class="fas fa-users"></i> Users</div>
            <div class="nav-item" data-page="register"><i class="fas fa-user-plus"></i> Register User</div>
            
            <div class="nav-section"><i class="fas fa-boxes"></i> PRODUCTS</div>
            <div class="nav-item" data-page="products"><i class="fas fa-cubes"></i> Products</div>
            <div class="nav-item" data-page="add-product"><i class="fas fa-plus-circle"></i> Add Product</div>
            
            <div class="nav-section"><i class="fas fa-warehouse"></i> WAREHOUSE</div>
            <div class="nav-item" data-page="warehouses"><i class="fas fa-building"></i> Warehouses</div>
            <div class="nav-item" data-page="stock"><i class="fas fa-chart-simple"></i> Stock Levels</div>
            <div class="nav-item" data-page="transfer"><i class="fas fa-exchange-alt"></i> Transfer Stock</div>
            
            <div class="nav-section"><i class="fas fa-clipboard-list"></i> PURCHASE</div>
            <div class="nav-item" data-page="purchase"><i class="fas fa-file-invoice"></i> Purchase Orders</div>
            <div class="nav-item" data-page="create-po"><i class="fas fa-cart-plus"></i> Create PO</div>
            
            <div class="nav-section"><i class="fas fa-truck"></i> VENDORS</div>
            <div class="nav-item" data-page="suppliers"><i class="fas fa-handshake"></i> Suppliers</div>
            
            <div class="nav-section"><i class="fas fa-chart-line"></i> ANALYTICS</div>
            <div class="nav-item" data-page="movements"><i class="fas fa-history"></i> Movements</div>
            <div class="nav-item" data-page="alerts"><i class="fas fa-bell"></i> Alerts</div>
            <div class="nav-item" data-page="reports"><i class="fas fa-chart-pie"></i> Reports</div>
        </div>
        
        <div style="padding: 20px; border-top: 1px solid #1E2438; margin-top: auto;">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
                <div style="width: 40px; height: 40px; background: linear-gradient(145deg, #2A2F45, #191E32); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold;">AD</div>
                <div><div style="font-weight: 600;">Admin User</div><div style="font-size: 12px; color: #E94560;">Administrator</div></div>
            </div>
            <button class="btn-outline" id="logoutBtn" style="width: 100%;"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </aside>
    
    <!-- Main Content -->
    <main class="main-content">
        <div id="pageContent" class="animate"></div>
    </main>
</div>

<script>
    // Mock Data
    const data = {
        stats: { products: 187, warehouses: 6, orders: 52, suppliers: 31, alerts: 4, value: 3245600 },
        lowStock: [
            { product: "Gaming Laptop", wh: "Mumbai", qty: 5 },
            { product: "Mechanical KB", wh: "Delhi", qty: 8 },
            { product: "4K Monitor", wh: "Bangalore", qty: 3 }
        ],
        orders: [
            { id: "PO-001", supplier: "TechGrid", status: "Pending", total: "₹2,14,500" },
            { id: "PO-002", supplier: "Global Impex", status: "Approved", total: "₹1,28,200" }
        ],
        products: [
            { id: "P001", name: "Ultrabook Pro", category: "Laptops", price: "₹1,24,999", stock: 42 },
            { id: "P002", name: "Wireless KB", category: "Accessories", price: "₹4,999", stock: 128 }
        ]
    };
    
    let currentPage = "dashboard";
    
    function navigateTo(page) {
        currentPage = page;
        document.querySelectorAll('.nav-item').forEach(el => {
            if(el.getAttribute('data-page') === page) el.classList.add('active');
            else el.classList.remove('active');
        });
        renderPage();
        window.history.pushState({ page }, "", "#" + page);
    }
    
    function renderPage() {
        const container = document.getElementById('pageContent');
        switch(currentPage) {
            case 'dashboard': container.innerHTML = renderDashboard(); break;
            case 'users': container.innerHTML = renderUsers(); break;
            case 'register': container.innerHTML = renderRegister(); break;
            case 'products': container.innerHTML = renderProducts(); break;
            case 'add-product': container.innerHTML = renderAddProduct(); break;
            case 'warehouses': container.innerHTML = renderWarehouses(); break;
            case 'stock': container.innerHTML = renderStock(); break;
            case 'transfer': container.innerHTML = renderTransfer(); break;
            case 'purchase': container.innerHTML = renderPurchase(); break;
            case 'create-po': container.innerHTML = renderCreatePO(); break;
            case 'suppliers': container.innerHTML = renderSuppliers(); break;
            case 'movements': container.innerHTML = renderMovements(); break;
            case 'alerts': container.innerHTML = renderAlerts(); break;
            case 'reports': container.innerHTML = renderReports(); break;
            default: container.innerHTML = renderDashboard();
        }
    }
    
    function renderDashboard() {
        return `
            <div>
                <div style="margin-bottom: 32px;">
                    <h1 style="font-size: 32px; font-weight: 800;">Dashboard</h1>
                    <p style="color: #9AA6C4;">Real-time inventory overview</p>
                </div>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 28px;">
                    <div class="stat-card"><i class="fas fa-boxes" style="font-size: 28px; color: #E94560;"></i><div style="font-size: 32px; font-weight: 800; margin-top: 12px;">${data.stats.products}</div><div>Products</div></div>
                    <div class="stat-card"><i class="fas fa-warehouse" style="font-size: 28px; color: #00D4FF;"></i><div style="font-size: 32px; font-weight: 800; margin-top: 12px;">${data.stats.warehouses}</div><div>Warehouses</div></div>
                    <div class="stat-card"><i class="fas fa-file-invoice" style="font-size: 28px; color: #FFAB00;"></i><div style="font-size: 32px; font-weight: 800; margin-top: 12px;">${data.stats.orders}</div><div>POs</div></div>
                    <div class="stat-card"><i class="fas fa-handshake" style="font-size: 28px; color: #00e676;"></i><div style="font-size: 32px; font-weight: 800; margin-top: 12px;">${data.stats.suppliers}</div><div>Suppliers</div></div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                    <div class="glass-card" style="padding: 24px;">
                        <h3><i class="fas fa-exclamation-triangle" style="color: #FFAB00;"></i> Low Stock Alerts</h3>
                        ${data.lowStock.map(item => `<div style="padding: 12px 0; border-bottom: 1px solid #1E2438;">${item.product} - ${item.wh}: <span class="badge-danger badge">Qty ${item.qty}</span></div>`).join('')}
                        <button class="btn-outline" style="margin-top: 16px;" onclick="navigateTo('alerts')">View All</button>
                    </div>
                    <div class="glass-card" style="padding: 24px;">
                        <h3>Recent Orders</h3>
                        ${data.orders.map(order => `<div style="padding: 12px 0; border-bottom: 1px solid #1E2438;">${order.id} - ${order.supplier} <span class="badge-warning badge">${order.status}</span></div>`).join('')}
                        <button class="btn-primary" style="margin-top: 16px;" onclick="navigateTo('purchase')">Manage Orders</button>
                    </div>
                </div>
                <div style="margin-top: 28px;">
                    <h3 style="margin-bottom: 16px;">Quick Actions</h3>
                    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                        <div class="quick-action" onclick="navigateTo('add-product')"><i class="fas fa-plus-circle"></i> Add Product</div>
                        <div class="quick-action" onclick="navigateTo('create-po')"><i class="fas fa-cart-plus"></i> Create PO</div>
                        <div class="quick-action" onclick="navigateTo('transfer')"><i class="fas fa-exchange-alt"></i> Transfer Stock</div>
                    </div>
                </div>
            </div>
        `;
    }
    
    function renderUsers() { return `<div class="glass-card" style="padding: 32px;"><h2>User Management</h2><table class="data-table"><thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Status</th></tr></thead><tbody><tr><td>1</td><td>admin@stockpro</td><td><span class="badge-danger">ADMIN</span></td><td><span class="badge-success">Active</span></td></tr><tr><td>2</td><td>manager@stockpro</td><td><span class="badge-warning">MANAGER</span></td><td><span class="badge-success">Active</span></td></tr></tbody></table></div>`; }
    function renderRegister() { return `<div class="glass-card" style="padding: 32px; max-width: 500px;"><h2>Register User</h2><div style="margin-top: 20px;"><input placeholder="Username" /><div style="height: 12px;"></div><input type="email" placeholder="Email" /><div style="height: 12px;"></div><input type="password" placeholder="Password" /><div style="height: 12px;"></div><select><option>STAFF</option><option>MANAGER</option><option>OFFICER</option><option>ADMIN</option></select><button class="btn-primary" style="margin-top: 20px; width: 100%;" onclick="alert('Demo: User registered')">Create Account</button></div></div>`; }
    function renderProducts() { return `<div class="glass-card" style="padding: 32px;"><h2>Product Catalogue</h2><table class="data-table"><thead><tr><th>SKU</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th></tr></thead><tbody>${data.products.map(p => `<tr><td>${p.id}</td><td>${p.name}</td><td>${p.category}</td><td>${p.price}</td><td>${p.stock}</td></tr>`).join('')}</tbody></table></div>`; }
    function renderAddProduct() { return `<div class="glass-card" style="padding: 32px; max-width: 600px;"><h2>Add New Product</h2><div style="display: grid; gap: 12px; margin-top: 20px;"><input placeholder="Product Name" /><input placeholder="SKU" /><input placeholder="Category" /><input placeholder="Price" /><input placeholder="Initial Stock" /><button class="btn-primary" onclick="alert('Product added (demo)')">Save Product</button></div></div>`; }
    function renderWarehouses() { return `<div class="glass-card" style="padding: 32px;"><h2>Warehouses</h2><div style="margin-top: 20px;">${['Mumbai Central', 'Delhi Logistics', 'Bangalore Tech Hub'].map(w => `<div style="padding: 16px; background: #0F131E; border-radius: 16px; margin-bottom: 12px;"><strong>${w}</strong><div style="font-size: 12px; color: #9AA6C4;">Capacity: 10,000+ units · Active</div></div>`).join('')}</div></div>`; }
    function renderStock() { return `<div class="glass-card" style="padding: 32px;"><h2>Stock Levels</h2><table class="data-table"><thead><tr><th>Warehouse</th><th>Product</th><th>Quantity</th><th>Status</th></tr></thead><tbody><tr><td>Mumbai</td><td>Laptop</td><td>142</td><td><span class="badge-success">Healthy</span></td></tr><tr><td>Delhi</td><td>Keyboard</td><td>8</td><td><span class="badge-warning">Low</span></td></tr></tbody></table></div>`; }
    function renderTransfer() { return `<div class="glass-card" style="padding: 32px;"><h2>Transfer Stock</h2><div style="margin-top: 20px;"><select><option>From: Mumbai WH</option></select><div style="height: 12px;"></div><select><option>To: Delhi WH</option></select><div style="height: 12px;"></div><input placeholder="Product SKU" /><div style="height: 12px;"></div><input placeholder="Quantity" /><button class="btn-primary" style="margin-top: 20px;">Execute Transfer</button></div></div>`; }
    function renderPurchase() { return `<div class="glass-card" style="padding: 32px;"><h2>Purchase Orders</h2><table class="data-table"><thead><tr><th>PO #</th><th>Supplier</th><th>Status</th><th>Total</th></tr></thead><tbody>${data.orders.map(o => `<tr><td>${o.id}</td><td>${o.supplier}</td><td><span class="badge-warning">${o.status}</span></td><td>${o.total}</td></tr>`).join('')}</tbody></table></div>`; }
    function renderCreatePO() { return `<div class="glass-card" style="padding: 32px;"><h2>Create Purchase Order</h2><div style="margin-top: 20px;"><input placeholder="Supplier" /><div style="height: 12px;"></div><input placeholder="Products / SKU" /><div style="height: 12px;"></div><textarea rows="3" placeholder="Items list"></textarea><button class="btn-primary" style="margin-top: 20px;">Generate PO</button></div></div>`; }
    function renderSuppliers() { return `<div class="glass-card" style="padding: 32px;"><h2>Suppliers</h2><table class="data-table"><thead><tr><th>Name</th><th>Contact</th><th>GST</th></tr></thead><tbody><tr><td>TechGrid</td><td>contact@techgrid.com</td><td>27AAACV1234</td></tr><tr><td>Global Impex</td><td>sales@global.com</td><td>08ABCFG7890</td></tr></tbody></table></div>`; }
    function renderMovements() { return `<div class="glass-card" style="padding: 32px;"><h2>Stock Movements</h2><table class="data-table"><thead><tr><th>Type</th><th>Product</th><th>Qty</th><th>Date</th></tr></thead><tbody><tr><td><span class="badge-info">INBOUND</span></td><td>Laptop</td><td>45</td><td>2026-04-26</td></tr></tbody></table></div>`; }
    function renderAlerts() { return `<div class="glass-card" style="padding: 32px;"><h2>Alerts & Notifications</h2>${data.lowStock.map(a => `<div style="padding: 16px; background: #0F131E; border-radius: 16px; margin-bottom: 12px;"><i class="fas fa-exclamation-circle" style="color: #FFAB00;"></i> Low stock: ${a.product} at ${a.wh} (${a.qty} units left)</div>`).join('')}</div>`; }
    function renderReports() { return `<div class="glass-card" style="padding: 32px;"><h2>Analytics Dashboard</h2><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;"><div class="stat-card"><div>Total Inventory Value</div><div style="font-size: 28px; font-weight: 800;">₹32.4L</div></div><div class="stat-card"><div>Top Product</div><div style="font-size: 20px;">Ultrabook Pro</div></div></div></div>`; }
    
    document.querySelectorAll('.nav-item').forEach(el => {
        const page = el.getAttribute('data-page');
        if(page) el.addEventListener('click', () => navigateTo(page));
    });
    
    document.getElementById('logoutBtn')?.addEventListener('click', () => {
        alert('Logged out (demo)');
        window.location.reload();
    });
    
    navigateTo('dashboard');
    window.addEventListener('popstate', () => navigateTo(window.location.hash.slice(1) || 'dashboard'));
</script>
</body>
</html>

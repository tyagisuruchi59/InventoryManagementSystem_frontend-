<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>StockPro · Intelligent Inventory Management</title>
    <!-- Google Fonts + Smooth Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0C10;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #EFF3F8;
            overflow-x: hidden;
        }

        /* custom scroll */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #1A1F2A;
        }
        ::-webkit-scrollbar-thumb {
            background: #E94560;
            border-radius: 8px;
        }

        /* glassmorphism + smooth transitions */
        .glass-card {
            background: rgba(18, 22, 32, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(233, 69, 96, 0.2);
            border-radius: 24px;
            transition: all 0.25s ease;
        }

        .glass-card:hover {
            border-color: rgba(233, 69, 96, 0.5);
            box-shadow: 0 15px 35px -15px rgba(0,0,0,0.5);
        }

        /* animated gradient border */
        .neon-border {
            position: relative;
            background: #0F1118;
            border-radius: 28px;
        }
        .neon-border::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 28px;
            padding: 1px;
            background: linear-gradient(135deg, #E94560, #7A4CFF);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* buttons */
        .btn-primary {
            background: linear-gradient(105deg, #E94560 0%, #C72C48 100%);
            border: none;
            border-radius: 40px;
            padding: 10px 24px;
            font-weight: 600;
            font-size: 14px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(233, 69, 96, 0.25);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(233, 69, 96, 0.35);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(233, 69, 96, 0.5);
            border-radius: 40px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 500;
            color: #EFF3F8;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-outline:hover {
            background: rgba(233, 69, 96, 0.1);
            border-color: #E94560;
        }

        /* metric tile */
        .metric-card {
            background: #0F121C;
            border-radius: 32px;
            padding: 20px 18px;
            border: 1px solid #1E2433;
            transition: all 0.2s;
        }
        .metric-card:hover {
            border-color: #E94560;
            transform: translateY(-3px);
        }

        /* dashboard quick action */
        .quick-action {
            background: rgba(15, 18, 28, 0.9);
            border-radius: 20px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid #222836;
            transition: 0.2s;
            cursor: pointer;
        }
        .quick-action:hover {
            background: #1A1F2E;
            border-color: #E94560;
            transform: translateX(5px);
        }

        /* side menu minimal */
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 16px;
            margin: 4px 0;
            transition: 0.2s;
            cursor: pointer;
            color: #9AA4BF;
        }
        .sidebar-item.active {
            background: linear-gradient(95deg, rgba(233,69,96,0.12) 0%, rgba(233,69,96,0.02) 100%);
            color: #E94560;
            border-left: 3px solid #E94560;
        }
        .sidebar-item:hover:not(.active) {
            background: #161C2A;
            color: #F0F3FA;
        }

        /* table modern */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th {
            text-align: left;
            padding: 16px 14px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #7E89A3;
            border-bottom: 1px solid #202635;
        }
        .data-table td {
            padding: 14px 14px;
            font-size: 13px;
            border-bottom: 1px solid #181E2A;
            color: #CBD5E6;
        }
        .data-table tr:hover td {
            background: #0E121D;
        }

        /* status badges */
        .badge {
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            width: fit-content;
        }
        .badge-success { background: rgba(0, 230, 118, 0.12); color: #00e676; border: 1px solid rgba(0,230,118,0.2); }
        .badge-warning { background: rgba(255, 171, 0, 0.12); color: #FFAB00; border: 1px solid rgba(255,171,0,0.2); }
        .badge-danger { background: rgba(233, 69, 96, 0.12); color: #E94560; border: 1px solid rgba(233,69,96,0.2); }
        .badge-info { background: rgba(0, 212, 255, 0.12); color: #00D4FF; border: 1px solid rgba(0,212,255,0.2); }

        /* fade-in animation */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeSlideUp 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }
    </style>
</head>
<body>

<div id="root" style="display: flex; min-height: 100vh;">
    <!-- SIDEBAR - enhanced neon touch -->
    <aside style="width: 280px; background: #0B0E16; border-right: 1px solid #171D2A; backdrop-filter: blur(2px); padding: 28px 16px; display: flex; flex-direction: column; position: sticky; top:0; height: 100vh;">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 40px; padding-left: 10px;">
            <div style="width: 44px; height: 44px; background: linear-gradient(135deg, #E94560, #A5223F); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 8px 20px rgba(233,69,96,0.3);">⬡</div>
            <div>
                <div style="font-size: 20px; font-weight: 800; letter-spacing: 1px;">StockPro</div>
                <div style="font-size: 10px; color: #6F7A97; font-family: monospace;">IMS · .NET 8</div>
            </div>
        </div>
        
        <nav style="flex:1; overflow-y: auto;">
            <div class="sidebar-item active" data-path="dashboard">
                <i class="fas fa-chart-line" style="width: 24px;"></i> <span>Home</span>
            </div>
            <div style="margin: 20px 0 8px 8px; font-size: 11px; font-weight: 600; color: #5A6583; letter-spacing: 1px;">AUTH SERVICE</div>
            <div class="sidebar-item" data-path="users"><i class="fas fa-users"></i> <span>User Management</span></div>
            <div class="sidebar-item" data-path="register"><i class="fas fa-user-plus"></i> <span>Register User</span></div>
            
            <div style="margin: 20px 0 8px 8px; font-size: 11px; font-weight: 600; color: #5A6583;">PRODUCT SERVICE</div>
            <div class="sidebar-item" data-path="products"><i class="fas fa-boxes"></i> <span>Products</span></div>
            <div class="sidebar-item" data-path="add-product"><i class="fas fa-plus-circle"></i> <span>Add Product</span></div>
            
            <div style="margin: 20px 0 8px 8px; font-size: 11px; font-weight: 600; color: #5A6583;">WAREHOUSE SERVICE</div>
            <div class="sidebar-item" data-path="warehouses"><i class="fas fa-warehouse"></i> <span>Warehouses</span></div>
            <div class="sidebar-item" data-path="stock"><i class="fas fa-chart-simple"></i> <span>Stock Levels</span></div>
            <div class="sidebar-item" data-path="transfer"><i class="fas fa-exchange-alt"></i> <span>Transfer Stock</span></div>
            
            <div style="margin: 20px 0 8px 8px; font-size: 11px; font-weight: 600; color: #5A6583;">PURCHASE SERVICE</div>
            <div class="sidebar-item" data-path="purchase"><i class="fas fa-clipboard-list"></i> <span>Purchase Orders</span></div>
            <div class="sidebar-item" data-path="create-po"><i class="fas fa-cart-plus"></i> <span>Create PO</span></div>
            
            <div class="sidebar-item" data-path="suppliers"><i class="fas fa-truck"></i> <span>Suppliers</span></div>
            <div class="sidebar-item" data-path="movements"><i class="fas fa-history"></i> <span>Movements</span></div>
            <div class="sidebar-item" data-path="alerts"><i class="fas fa-bell"></i> <span>Alerts</span></div>
            <div class="sidebar-item" data-path="reports"><i class="fas fa-chart-pie"></i> <span>Analytics</span></div>
        </nav>
        
        <div style="margin-top: auto; border-top: 1px solid #1E2437; padding-top: 20px;">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 16px;">
                <div style="width: 42px; height: 42px; background: linear-gradient(145deg, #E94560, #B52E4B); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px;">A</div>
                <div><div style="font-weight: 600;">Admin User</div><div style="font-size: 11px; color:#E94560;">ADMIN</div></div>
            </div>
            <button id="logoutBtn" class="btn-outline" style="width:100%;"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </aside>
    
    <!-- MAIN CONTENT (dynamic) -->
    <main style="flex:1; background: #0A0C10; padding: 28px 36px; overflow-y: auto;">
        <div id="dynamic-content" class="animate-in">
            <!-- will be replaced via JS -->
        </div>
    </main>
</div>

<script>
    // ---------- MOCK DATA (simulate API calls) but matching StockPro style ----------
    const mockData = {
        // dashboard stats
        products: 142,
        warehouses: 5,
        orders: 38,
        suppliers: 24,
        alerts: 7,
        movements: 312,
        stockValue: 1842900,
        // low stock items
        lowStockItems: [
            { productId: 101, warehouseId: 2, quantity: 8, stockValue: 12000 },
            { productId: 205, warehouseId: 1, quantity: 4, stockValue: 5600 },
            { productId: 307, warehouseId: 3, quantity: 2, stockValue: 990 }
        ],
        // top products
        topProducts: [
            { rank:1, productId: 1001, name:"Ultrabook X1", movementQty: 342, revenue: "₹5.2L" },
            { rank:2, productId: 1002, name:"Mechanical Keyboard", movementQty: 289, revenue: "₹1.8L" },
            { rank:3, productId: 1003, name:"Wireless Mouse", movementQty: 210, revenue: "₹85K" }
        ],
        // recent purchase orders
        purchaseOrders: [
            { id: "PO-2401", supplier: "TechGrid Solutions", status: "PENDING", total: "₹1,24,500", date: "2026-04-25" },
            { id: "PO-2402", supplier: "Global Impex", status: "APPROVED", total: "₹84,200", date: "2026-04-22" },
            { id: "PO-2403", supplier: "InnoParts", status: "DRAFT", total: "₹43,990", date: "2026-04-20" }
        ],
        // warehouses list
        warehouses: [
            { id:1, name:"Mumbai Central", city:"Mumbai", capacity:15000, active:true },
            { id:2, name:"Delhi Logistics", city:"Delhi", capacity:12000, active:true },
            { id:3, name:"Bangalore Hub", city:"Bangalore", capacity:10000, active:true }
        ],
        // recent stock movements
        recentMovements: [
            { id:1, type:"STOCK_IN", productId:45, qty:120, ref:"PO-101", date:"2026-04-26" },
            { id:2, type:"STOCK_OUT", productId:87, qty:25, ref:"SALE-ORD", date:"2026-04-25" },
            { id:3, type:"TRANSFER_IN", productId:32, qty:60, ref:"INT-TRF", date:"2026-04-24" }
        ]
    };
    
    // router helpers
    let currentPath = "dashboard";
    
    function setActiveSidebar(path) {
        document.querySelectorAll('.sidebar-item').forEach(el => {
            const itemPath = el.getAttribute('data-path');
            if(itemPath === path) el.classList.add('active');
            else el.classList.remove('active');
        });
    }
    
    function navigateTo(path) {
        currentPath = path;
        setActiveSidebar(path);
        renderPage();
        window.history.pushState({ path }, "", `#${path}`);
    }
    
    // ---------- RENDER ENGINE : each screen becomes sleek UI ----------
    function renderPage() {
        const container = document.getElementById('dynamic-content');
        if(!container) return;
        switch(currentPath) {
            case 'dashboard': container.innerHTML = renderDashboard(); break;
            case 'users': container.innerHTML = renderUsers(); break;
            case 'register': container.innerHTML = renderRegisterUser(); break;
            case 'products': container.innerHTML = renderProducts(); break;
            case 'add-product': container.innerHTML = renderAddProduct(); break;
            case 'warehouses': container.innerHTML = renderWarehouses(); break;
            case 'stock': container.innerHTML = renderStockLevels(); break;
            case 'transfer': container.innerHTML = renderTransfer(); break;
            case 'purchase': container.innerHTML = renderPurchaseOrders(); break;
            case 'create-po': container.innerHTML = renderCreatePO(); break;
            case 'suppliers': container.innerHTML = renderSuppliers(); break;
            case 'movements': container.innerHTML = renderMovements(); break;
            case 'alerts': container.innerHTML = renderAlerts(); break;
            case 'reports': container.innerHTML = renderReports(); break;
            default: container.innerHTML = renderDashboard();
        }
    }
    
    // ------- UI COMPONENTS (modern, glass, animated) -------
    function renderDashboard() {
        const stats = mockData;
        return `
            <div class="animate-in">
                <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 32px;">
                    <div>
                        <div style="font-size: 13px; color:#E94560; font-weight:600; letter-spacing:1px;"><i class="fas fa-charging-station"></i> INTELLIGENT INVENTORY CORE</div>
                        <h1 style="font-size: 32px; font-weight:800; margin-top:6px;">Dashboard <span style="color:#E94560;">| Live Metrics</span></h1>
                        <p style="color:#8F9BB5;">Microservices orchestrated · Real-time visibility</p>
                    </div>
                    <button class="btn-primary" onclick="navigateTo('reports')"><i class="fas fa-chart-line"></i> Full Analytics</button>
                </div>
                
                <!-- KPI cards -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 20px; margin-bottom: 32px;">
                    ${[
                        {label:"Total Stock Value", value:"₹"+stats.stockValue.toLocaleString(), icon:"fas fa-coins", color:"#00e676"},
                        {label:"Products", value:stats.products, icon:"fas fa-box", color:"#E94560"},
                        {label:"Warehouses", value:stats.warehouses, icon:"fas fa-building", color:"#00D4FF"},
                        {label:"Purchase Orders", value:stats.orders, icon:"fas fa-file-invoice", color:"#FFAB00"},
                        {label:"Active Suppliers", value:stats.suppliers, icon:"fas fa-handshake", color:"#C084FC"},
                    ].map(k=>`<div class="metric-card"><i class="${k.icon}" style="font-size:28px; color:${k.color}; margin-bottom:12px; display:block;"></i><div style="font-size:28px; font-weight:800;">${k.value}</div><div style="color:#99A4C2;">${k.label}</div></div>`).join('')}
                </div>
                
                <!-- Low stock + recent activity -->
                <div style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 24px;">
                    <div class="glass-card" style="padding: 20px;">
                        <div style="display: flex; justify-content: space-between; border-bottom:1px solid #202635; padding-bottom:12px;"><span><i class="fas fa-exclamation-triangle" style="color:#FFAB00;"></i> <strong>Low Stock Items</strong></span><span class="badge-warning badge">${mockData.lowStockItems.length} alerts</span></div>
                        <div style="margin-top: 14px;">
                            ${mockData.lowStockItems.map(item => `
                                <div style="display:flex; justify-content: space-between; padding:12px 0; border-bottom:1px solid #131824;">
                                    <span>Product #${item.productId}</span> <span class="badge-warning badge">⚠️ Qty: ${item.quantity}</span> <span style="color:#E94560;">₹${item.stockValue}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="glass-card" style="padding: 20px;">
                        <div><i class="fas fa-truck-fast"></i> <strong>Recent Purchase Orders</strong></div>
                        <table class="data-table" style="margin-top: 12px;">
                            <thead><tr><th>PO ID</th><th>Supplier</th><th>Status</th><th>Amount</th></tr></thead>
                            <tbody>
                                ${mockData.purchaseOrders.map(po => `<tr><td>${po.id}</td><td>${po.supplier}</td><td><span class="badge ${po.status === 'PENDING'?'badge-warning':po.status==='APPROVED'?'badge-success':'badge-info'}">${po.status}</span></td><td>${po.total}</td></tr>`).join('')}
                            </tbody>
                        </table>
                        <div style="margin-top: 14px;"><button class="btn-outline" onclick="navigateTo('purchase')">View all orders →</button></div>
                    </div>
                </div>
                
                <!-- quick actions micro -->
                <div style="margin-top: 36px;">
                    <div style="margin-bottom: 16px;"><i class="fas fa-bolt"></i> Quick Actions</div>
                    <div style="display: flex; gap: 16px; flex-wrap:wrap;">
                        ${[
                            {label:"Add Product", icon:"fas fa-plus-circle", path:"add-product"},
                            {label:"Create PO", icon:"fas fa-file-invoice-dollar", path:"create-po"},
                            {label:"Record Movement", icon:"fas fa-arrows-spin", path:"movements"},
                            {label:"Send Alert", icon:"fas fa-bell", path:"alerts"}
                        ].map(q=>`<div class="quick-action" onclick="navigateTo('${q.path}')"><i class="${q.icon}" style="font-size:20px;"></i> ${q.label}</div>`).join('')}
                    </div>
                </div>
            </div>
        `;
    }
    
    function renderUsers() {
        return `<div class="animate-in glass-card" style="padding: 28px;"><h2 style="font-weight:700;"><i class="fas fa-shield-alt"></i> User Management</h2><p style="color:#9AA4BF;">Manage RBAC roles and active users</p><div style="margin-top:24px;"><i class="fas fa-clock"></i> Integrated with Auth Service (JWT). Mock table:</div><table class="data-table"><thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Status</th></tr></thead><tbody><tr><td>1</td><td>admin@stockpro</td><td>ADMIN</td><td><span class="badge-success badge">Active</span></td></tr><tr><td>2</td><td>warehouse_mgr</td><td>MANAGER</td><td><span class="badge-success badge">Active</span></td></tr><tr><td>3</td><td>purchase_officer</td><td>OFFICER</td><td><span class="badge-success badge">Active</span></td></tr></tbody></table></div>`;
    }
    function renderRegisterUser() { return `<div class="glass-card animate-in" style="padding: 32px; max-width:500px;"><h2><i class="fas fa-user-plus"></i> Register New User</h2><div style="margin-top:24px;"><input class="btn-outline" placeholder="Username" style="width:100%; background:#0F121C; border:1px solid #292F3F; padding:12px; border-radius:40px; margin-bottom:16px;"><input type="password" placeholder="Password" style="width:100%; background:#0F121C; padding:12px; border-radius:40px; margin-bottom:16px;"><select style="width:100%; background:#0F121C; padding:12px; border-radius:40px;"><option>STAFF</option><option>MANAGER</option><option>OFFICER</option><option>ADMIN</option></select><button class="btn-primary" style="margin-top:24px;">Create Account</button></div></div>`; }
    
    function renderProducts() { return `<div class="animate-in"><div class="glass-card" style="padding:24px;"><h2>📦 Product Catalogue</h2><table class="data-table"><thead><tr><th>SKU</th><th>Name</th><th>Category</th><th>Selling Price</th><th>Stock Qty</th></tr></thead><tbody>${[["PRO-101","Ultrabook X1","Electronics","₹89,999","143"],["PRO-102","Mechanical KBD","Accessory","₹4,299","220"],["PRO-103","Monitor 27" ,"Electronics","₹24,500","87"]].map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td>${p[4]}</td></tr>`).join('')}</tbody></table><button class="btn-primary" style="margin-top:20px;" onclick="navigateTo('add-product')">+ New Product</button></div></div>`; }
    function renderAddProduct() { return `<div class="glass-card" style="padding:32px;"><h2>➕ Add Product</h2><div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px;"><input placeholder="SKU" class="btn-outline" style="padding:12px;"><input placeholder="Name" style="padding:12px;"><input placeholder="Category"><input placeholder="Cost Price"><input placeholder="Selling Price"><input placeholder="Reorder Level"></div><button class="btn-primary" style="margin-top:24px;">Create Product</button></div>`; }
    
    function renderWarehouses() { return `<div class="glass-card animate-in" style="padding:24px;"><h2>🏭 Warehouse Locations</h2><div style="display:grid; gap:16px; margin-top:24px;">${mockData.warehouses.map(w=>`<div style="background:#0F121C; border-radius:20px; padding:18px; border-left:4px solid #E94560;"><div><strong>${w.name}</strong> <span style="float:right;">ID:${w.id}</span></div><div>📍 ${w.city} · Capacity: ${w.capacity} units</div><span class="badge-success badge">Active</span></div>`).join('')}</div></div>`; }
    function renderStockLevels() { return `<div class="glass-card" style="padding:24px;"><h2>📊 Stock Levels Overview</h2><table class="data-table"><thead><tr><th>Warehouse</th><th>Product ID</th><th>Quantity</th><th>Status</th></tr></thead><tbody><tr><td>Mumbai WH</td><td>#101</td><td>240</td><td class="badge-success">OK</td></tr><tr><td>Delhi WH</td><td>#205</td><td>8</td><td class="badge-warning">Low Stock</td></tr><tr><td>Bangalore WH</td><td>#307</td><td>64</td><td>OK</td></tr></tbody></table></div>`; }
    function renderTransfer() { return `<div class="glass-card" style="padding:28px;"><h2>⇄ Inter-Warehouse Transfer</h2><div style="margin-top:20px;"><select class="btn-outline" style="width:100%; margin-bottom:16px;"><option>From Warehouse: Mumbai</option><option>From Warehouse: Delhi</option></select><select class="btn-outline" style="width:100%; margin-bottom:16px;"><option>To Warehouse: Bangalore</option></select><input placeholder="Product ID" class="btn-outline" style="width:100%; margin-bottom:16px;"><input placeholder="Quantity" class="btn-outline" style="width:100%;"><button class="btn-primary" style="margin-top:24px;">Execute Transfer</button></div></div>`; }
    function renderPurchaseOrders() { return `<div class="glass-card" style="padding:24px;"><h2>📋 Purchase Orders</h2><table class="data-table"><thead><tr><th>PO#</th><th>Supplier</th><th>Status</th><th>Total</th></tr></thead><tbody>${mockData.purchaseOrders.map(po=>`<tr><td>${po.id}</td><td>${po.supplier}</td><td><span class="badge ${po.status==='PENDING'?'badge-warning':'badge-success'}">${po.status}</span></td><td>${po.total}</td></tr>`).join('')}</tbody></table><button class="btn-primary" style="margin-top:24px;" onclick="navigateTo('create-po')">+ Create Purchase Order</button></div>`; }
    function renderCreatePO() { return `<div class="glass-card" style="padding:28px;"><h2>➕ New Purchase Order</h2><div><input placeholder="Supplier ID" class="btn-outline" style="width:100%; margin-bottom:12px;"><input placeholder="Warehouse ID"><textarea placeholder="Line Items (JSON demo)"></textarea><button class="btn-primary">Generate Draft PO</button></div></div>`;}
    function renderSuppliers() { return `<div class="glass-card" style="padding:24px;"><h2>🏢 Supplier Registry</h2><table class="data-table"><thead><tr><th>Name</th><th>Contact</th><th>GST</th></tr></thead><tbody><tr><td>TechGrid Solutions</td><td>contact@techgrid.com</td><td>27AAACV1234</td></tr><tr><td>Global Impex</td><td>sales@globalimpex.in</td><td>08ABCFG7890</td></tr></tbody></table></div>`; }
    function renderMovements() { return `<div class="glass-card animate-in" style="padding:24px;"><h2>🔄 Stock Movement History</h2><table class="data-table"><thead><tr><th>Type</th><th>Product</th><th>Qty</th><th>Reference</th><th>Date</th></tr></thead><tbody>${mockData.recentMovements.map(m=>`<tr><td><span class="badge-info">${m.type}</span></td><td>#${m.productId}</td><td>${m.qty}</td><td>${m.ref}</td><td>${m.date}</td></tr>`).join('')}</tbody></table><button class="btn-primary" style="margin-top:20px;" onclick="navigateTo('movements')">+ Record Movement</button></div>`; }
    function renderAlerts() { return `<div class="glass-card" style="padding:24px;"><h2>🔔 Active Alerts</h2><div class="badge-warning badge" style="margin-bottom:16px;"><i class="fas fa-bell"></i> 3 unacknowledged alerts</div><div style="background:#181E2A; border-radius:16px; padding:16px; margin-top:8px;"><i class="fas fa-exclamation-circle" style="color:#FFAB00;"></i> Low stock: Product #205 in Delhi WH (only 8 units)</div><div style="background:#181E2A; border-radius:16px; padding:16px; margin-top:12px;"><i class="fas fa-file-invoice"></i> PO-2402 pending approval for >48h</div></div>`; }
    function renderReports() { return `<div class="glass-card" style="padding:28px;"><h2><i class="fas fa-chart-pie"></i> Business Intelligence</h2><div style="display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:24px;"><div class="metric-card"><div>Total Stock Value</div><div style="font-size:32px; font-weight:800;">₹18.4L</div></div><div><div>Top Moving SKU</div><div class="badge-success">Ultrabook X1 (342 units)</div></div></div><div class="badge-info" style="padding:12px;"><i class="fas fa-database"></i> Snapshot: Last update 26/04/2026 · Report Service (UC8)</div></div>`; }
    
    // logout
    document.getElementById('logoutBtn')?.addEventListener('click', ()=>{
        localStorage.clear();
        alert("Logged out (demo) · Redirecting to login");
        window.location.href = "#login";
        renderDashboard();
    });
    
    // sidebar event listeners
    document.querySelectorAll('.sidebar-item').forEach(el => {
        const path = el.getAttribute('data-path');
        if(path) el.addEventListener('click', () => navigateTo(path));
    });
    
    // initial load
    navigateTo('dashboard');
    window.addEventListener('popstate', () => {
        const hash = window.location.hash.slice(1);
        if(hash && hash !== currentPath) navigateTo(hash);
        else navigateTo('dashboard');
    });
</script>
